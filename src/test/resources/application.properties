spring.application.name=bikes
# LOCALE config
spring.web.locale-resolver=fixed
spring.web.locale=pt_BR

# H2 Config (banco em memória usado apenas nos testes)
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:bikes-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop

# JWT
jwt.secret=bikes-chave-secreta-de-teste-0123456789abcdef
jwt.expiration-minutes=30

# SWAGGER (mesmos caminhos do application.properties principal)
springdoc.swagger-ui.path=/docs-bikes.html
springdoc.api-docs.path=/docs-bikes
springdoc.packages-to-scan=br.edu.ifc.bikes.web.controller
